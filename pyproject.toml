[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
# Auto-apply safe fixes (for example, unused imports) when Ruff runs with linting.
fix = true

[tool.ruff.format]
quote-style = "single"
# Format Python snippets inside docstrings for consistent examples.
docstring-code-format = true
# Match docstring snippet wrapping to the configured line length policy.
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
# Keep explicit rules you already enabled.
# F401: remove unused imports.
# F541: drop f-prefix on strings without placeholders.
# I: normalize and sort imports.
# B: flake8-bugbear correctness and robustness checks.
# C4: comprehension style simplifications.
# SIM: simplify boolean/control-flow patterns.
# UP: pyupgrade modernizations for Python 3.13.
# RUF: Ruff-native consistency checks.
# D, DOC: docstring style checks.
extend-select = ["F401", "F541", "I", "B", "C4", "SIM", "UP", "RUF", "Q"]
allowed-confusables = ["–"]
# Prevent Ruff from automatically deleting downstream cell imports or
# solution implementations when F811 (redefined-while-unused) is flagged
unfixable = ["F811"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
# All Jupyter notebooks:
# E402: Module level import not at top of file (imports are introduced cell-by-cell)
"*.ipynb" = ["E402"]

# Lecture & workshop templates:
# Preserve scaffolding imports and stubs intended for live coding and student exercises
"*template*.ipynb" = ["F401", "F811", "F821", "F841", "B007"]

# Workshop solution notebooks:
# Skeletons in problem prompts define stubs that are subsequently implemented in solution cells
"*workshop*solution*.ipynb" = ["F811", "F841", "B007"]

[tool.ruff.lint.isort]
# Normalize `import x as y, z as w` style for stable import diffs.
combine-as-imports = true
# Sort imports consistently inside each section.
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
# Ensure it understands you are using NumPy style format
convention = "numpy"
